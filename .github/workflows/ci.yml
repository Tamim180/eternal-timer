name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - name: Syntax check
        run: python -m py_compile eternal_timer_core.py eternal_timer_sync.py eternal_timer_gui.py etimer
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  android-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install cryptography
      - name: Install Kotlin compiler
        run: |
          curl -sL -o kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q kotlin.zip
      - name: Kotlin <-> Python interoperability test
        run: KOTLINC="$PWD/kotlinc/bin/kotlinc" ./android/tests/interop.sh
