app-id: com.eternaltimer.EternalTimer
# Rename the app-id (and this file) to a reverse-DNS id you actually control
# if you ever want to publish this on Flathub, e.g. io.github.<you>.EternalTimer.
# For a purely local/personal build the id above is fine as-is.

runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
sdk-version: '6.11'

# PySide6 itself comes from the official prebuilt BaseApp instead of pip
# wheels -- this is what KDE's own docs recommend for PySide6 Flatpaks,
# and sidesteps the PySide6/shiboken6 build-from-source pain entirely.
# https://github.com/flathub/io.qt.PySide.BaseApp
base: io.qt.PySide.BaseApp
base-version: '6.11'

command: eternal-timer

finish-args:
  - --share=ipc
  - --share=network            # phone sync talks to the relay (ntfy)
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  - --talk-name=org.freedesktop.Notifications
  # No --filesystem permission is needed for the state file: it lives
  # under the app's own sandboxed data dir (~/.var/app/<app-id>/data),
  # which every Flatpak app can read/write by default.

modules:
  # --- cryptography (for phone sync) -- prebuilt wheels, not a source build
  # Only the sync feature needs this; PySide6 itself comes from the
  # BaseApp above, not from here. The *.json file is generated by
  # flatpak-pip-generator -- see docs/FLATPAK.md. It isn't committed to
  # this folder because its exact contents depend on the runtime
  # version/date you build against.
  - cryptography-sources.json

  # --- Eternal Timer itself --------------------------------------------
  - name: eternal-timer
    buildsystem: simple
    build-commands:
      - install -Dm755 eternal_timer_gui.py /app/bin/eternal_timer_gui.py
      - install -Dm755 eternal_timer_core.py /app/bin/eternal_timer_core.py
      - install -Dm755 eternal_timer_sync.py /app/bin/eternal_timer_sync.py
      - install -Dm755 etimer /app/bin/etimer
      - install -Dm755 eternal-timer /app/bin/eternal-timer
      - install -Dm644 com.eternaltimer.EternalTimer.desktop /app/share/applications/com.eternaltimer.EternalTimer.desktop
      - install -Dm644 com.eternaltimer.EternalTimer.metainfo.xml /app/share/metainfo/com.eternaltimer.EternalTimer.metainfo.xml
      - install -Dm644 icon-128.png /app/share/icons/hicolor/128x128/apps/com.eternaltimer.EternalTimer.png
      - install -Dm644 icon-256.png /app/share/icons/hicolor/256x256/apps/com.eternaltimer.EternalTimer.png
    sources:
      - type: file
        path: ../eternal_timer_gui.py
      - type: file
        path: ../eternal_timer_core.py
      - type: file
        path: ../eternal_timer_sync.py
      - type: file
        path: ../etimer
      - type: file
        path: eternal-timer
      - type: file
        path: com.eternaltimer.EternalTimer.desktop
      - type: file
        path: com.eternaltimer.EternalTimer.metainfo.xml
      - type: file
        path: icon-128.png
      - type: file
        path: icon-256.png
